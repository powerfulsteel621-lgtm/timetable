<!--
  Renert Links: "Your account" section
  Paste this block into the page where the section should appear.
  It must be served from https://links.renertschool.ca so the browser
  sends the school sign-in cookie with the request.
-->
<section class="rl-account" id="rl-account" aria-labelledby="rl-account-title">
  <div class="rl-account__head">
    <h2 id="rl-account-title">Your account</h2>
    <button type="button" class="rl-account__refresh" id="rl-account-refresh">Refresh</button>
  </div>
  <p class="rl-account__status" id="rl-account-status" aria-live="polite">Loading your account…</p>
  <dl class="rl-account__fields" id="rl-account-fields" hidden></dl>
  <details class="rl-account__raw" id="rl-account-raw" hidden>
    <summary>Show raw response</summary>
    <pre id="rl-account-raw-text"></pre>
  </details>
  <a class="rl-account__signin" id="rl-account-signin" hidden>Sign in with your Renert account</a>
</section>

<style>
  .rl-account {
    font: inherit;
    color: inherit;
    max-width: 40rem;
    padding: 1rem 1.25rem;
    border: 1px solid rgba(127, 127, 127, 0.35);
    border-radius: 8px;
  }
  .rl-account__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .rl-account h2 {
    margin: 0 0 0.5rem;
    font-size: 1.15rem;
  }
  .rl-account__refresh,
  .rl-account__signin {
    font: inherit;
    font-size: 0.9rem;
    color: inherit;
    background: transparent;
    border: 1px solid rgba(127, 127, 127, 0.5);
    border-radius: 6px;
    padding: 0.3rem 0.75rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .rl-account__refresh:focus-visible,
  .rl-account__signin:focus-visible,
  .rl-account__raw summary:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
  .rl-account__status {
    margin: 0 0 0.75rem;
    opacity: 0.8;
  }
  .rl-account__status[data-state="error"] {
    opacity: 1;
    color: #c0392b;
  }
  .rl-account__fields {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.4rem 1.25rem;
    margin: 0 0 0.75rem;
  }
  .rl-account__fields dt {
    opacity: 0.7;
  }
  .rl-account__fields dd {
    margin: 0;
    overflow-wrap: anywhere;
  }
  .rl-account__fields pre,
  .rl-account__raw pre {
    margin: 0;
    white-space: pre-wrap;
    overflow-x: auto;
    font-size: 0.85rem;
  }
  .rl-account__raw summary {
    cursor: pointer;
    font-size: 0.9rem;
    opacity: 0.8;
  }
  .rl-account__raw pre {
    margin-top: 0.5rem;
  }
  @media (max-width: 480px) {
    .rl-account__fields {
      grid-template-columns: 1fr;
    }
    .rl-account__fields dd {
      margin-bottom: 0.5rem;
    }
  }
</style>

<script>
  (function () {
    // ---- Settings -------------------------------------------------------
    const CONFIG = {
      // Endpoint that returns the signed-in user's JSON.
      // Use "/api/v1/taha" to test today; switch to "/api/v1/me" once it exists
      // so the section works for every student without knowing their username.
      apiPath: "/api/v1/me",

      // Where to send people who aren't signed in. Replace with the site's
      // sign-in route once you know it (ask Mr. Gordon).
      signInUrl: window.location.pathname,

      // Friendly labels for known fields. Unknown fields are still shown,
      // with their name tidied up automatically.
      labels: {
        display_first_name: "First name",
        last_name: "Last name",
        email: "Email",
        grade: "Grade",
      },

      // When opened on localhost, show this sample instead of calling the
      // server, so the layout can be tested without the school sign-in.
      sampleForLocalhost: {
        display_first_name: "Taha",
        email: "taha.farooq@renertschool.ca",
        grade: "12",
        last_name: "Farooq",
      },
    };
    // ---------------------------------------------------------------------

    const el = {
      status: document.getElementById("rl-account-status"),
      fields: document.getElementById("rl-account-fields"),
      raw: document.getElementById("rl-account-raw"),
      rawText: document.getElementById("rl-account-raw-text"),
      signin: document.getElementById("rl-account-signin"),
      refresh: document.getElementById("rl-account-refresh"),
    };

    function tidyName(key) {
      const words = key.replace(/[_-]+/g, " ").trim();
      return words.charAt(0).toUpperCase() + words.slice(1);
    }

    function setStatus(text, state) {
      el.status.textContent = text;
      el.status.dataset.state = state || "";
      el.status.hidden = !text;
    }

    function reset() {
      el.fields.hidden = true;
      el.fields.replaceChildren();
      el.raw.hidden = true;
      el.signin.hidden = true;
    }

    function render(data) {
      const entries = Object.entries(data);
      if (entries.length === 0) {
        setStatus("The server returned no account details.", "error");
        return;
      }
      for (const [key, value] of entries) {
        const dt = document.createElement("dt");
        dt.textContent = CONFIG.labels[key] || tidyName(key);
        const dd = document.createElement("dd");
        if (value !== null && typeof value === "object") {
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(value, null, 2);
          dd.appendChild(pre);
        } else {
          dd.textContent = value === null || value === "" ? "Not set" : String(value);
        }
        el.fields.append(dt, dd);
      }
      el.rawText.textContent = JSON.stringify(data, null, 2);
      el.fields.hidden = false;
      el.raw.hidden = false;
      setStatus("", "");
    }

    function showSignIn() {
      setStatus("You're not signed in, so your account details can't be loaded.", "error");
      el.signin.href = CONFIG.signInUrl;
      el.signin.hidden = false;
    }

    async function load() {
      reset();
      setStatus("Loading your account…", "loading");

      const host = window.location.hostname;
      if (host === "localhost" || host === "127.0.0.1") {
        render(CONFIG.sampleForLocalhost);
        setStatus("Showing sample data (running on localhost).", "");
        return;
      }

      let res;
      try {
        res = await fetch(CONFIG.apiPath, {
          credentials: "same-origin",
          redirect: "manual",
          cache: "no-store",
          headers: { Accept: "application/json" },
        });
      } catch (err) {
        setStatus("Couldn't reach the school server. Check your connection and select Refresh.", "error");
        return;
      }

      // A redirect means the server is sending the user to Google sign-in.
      if (res.type === "opaqueredirect" || res.status === 401 || res.status === 403) {
        showSignIn();
        return;
      }
      if (res.status === 404) {
        setStatus("No account details were found for this sign-in. If you're a student, tell Mr. Gordon.", "error");
        return;
      }
      if (!res.ok) {
        setStatus("The school server returned an error (" + res.status + "). Select Refresh to try again.", "error");
        return;
      }

      const type = res.headers.get("content-type") || "";
      if (!type.includes("json")) {
        setStatus("The server sent a page instead of account data. Try signing in again.", "error");
        return;
      }

      try {
        render(await res.json());
      } catch (err) {
        setStatus("The server's response couldn't be read.", "error");
      }
    }

    el.refresh.addEventListener("click", load);
    load();
  })();
</script>
